version: '3.8'

services:
  # PostgreSQL for structured data
  postgres:
    image: postgres:15-alpine
    container_name: onchain_erp_postgres
    environment:
      POSTGRES_DB: onchain_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp_network

  # MongoDB — system logs and unstructured documents (not domain entities)
  mongodb:
    image: mongo:7.0
    container_name: onchain_erp_mongodb
    environment:
      MONGO_INITDB_DATABASE: onchain_erp
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - erp_network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: onchain_erp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp_network

  # pgAdmin for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: onchain_erp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@onchainerp.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - erp_network

  # Mongo Express for MongoDB management
  mongo-express:
    image: mongo-express:latest
    container_name: onchain_erp_mongo_express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - erp_network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  erp_network:
    driver: bridge
