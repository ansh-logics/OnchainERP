services:
  # PostgreSQL for structured data
  postgres:
    image: postgres:15-alpine
    container_name: yukti_erp_postgres_dev
    environment:
      POSTGRES_DB: yukti_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - erp_network_dev

  # MongoDB for logs and unstructured documents
  mongodb:
    image: mongo:7.0
    container_name: yukti_erp_mongo_dev
    environment:
      MONGO_INITDB_DATABASE: yukti_erp
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - erp_network_dev

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: yukti_erp_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - erp_network_dev

  # pgAdmin for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yukti_erp_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@yuktierp.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - erp_network_dev

  # Mongo Express for MongoDB management
  mongo-express:
    image: mongo-express:latest
    container_name: yukti_erp_mongo_express_dev
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - erp_network_dev

  backend:
    build:
      context: ./backend
    container_name: yukti_erp_backend_dev
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - postgres
      - mongodb
    networks:
      - erp_network_dev

  frontend:
    build:
      context: ./frontend
    container_name: yukti_erp_frontend_dev
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - erp_network_dev

volumes:
  postgres_data_dev:
  mongodb_data_dev:
  redis_data_dev:

networks:
  erp_network_dev:
    driver: bridge
